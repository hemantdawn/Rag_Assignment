[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-online-assessment"
version = "0.1.0"
description = "A local-first, citation-aware RAG service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pdfplumber>=0.11,<1",
]

[project.optional-dependencies]
documents = ["docling>=2,<3"]
llm = ["openai>=1,<3"]
semantic = ["sentence-transformers>=3,<6"]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
